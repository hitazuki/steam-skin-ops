services:
  steam-skin-ops:
    image: docker.io/hitazuki/steam-skin-ops:latest
    container_name: steam-skin-ops
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config/monitor.yaml:/app/config/monitor.yaml:ro
    mem_limit: 512m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
